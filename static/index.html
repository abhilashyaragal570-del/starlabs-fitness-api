<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StarLabs Fitness Studio</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1c2333;--mute:#6b7488;--brand:#6c4cf1;--brand2:#2bb7da;--ok:#12a36b;--bad:#d64545;--line:#e4e8f1;--shadow:rgba(30,40,80,.08);--okbg:#e6f7f0;--lowbg:#fff1e0;--lowfg:#c26a00;--badbg:#fde8e8}
@media (prefers-color-scheme: dark){
:root{--bg:#0f1220;--card:#181c30;--ink:#eef0f8;--mute:#9aa3bd;--line:#2a3050;--shadow:rgba(0,0,0,.4);--okbg:#12342a;--lowbg:#3a2a12;--lowfg:#ffb454;--badbg:#3a1a1a}
input{background:#10142a!important}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);transition:background .3s}

header{position:relative;overflow:hidden;color:#fff;padding:34px 20px 40px;background:linear-gradient(120deg,#6c4cf1,#2bb7da,#8b5cf6,#2bb7da);background-size:300% 300%;animation:flow 12s ease infinite}
.blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.14);filter:blur(2px);animation:float 9s ease-in-out infinite}
.b1{width:180px;height:180px;right:6%;top:-50px}
.b2{width:110px;height:110px;right:22%;bottom:-40px;animation-delay:-3s}
.b3{width:70px;height:70px;left:46%;top:14px;animation-delay:-6s}
@keyframes flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-18px) scale(1.06)}}
.bar{position:relative;max-width:1000px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:1.7rem;margin:0;animation:rise .7s both}
.sub{opacity:.9;font-size:.95rem;margin-top:4px;animation:rise .7s .1s both}
#who{animation:rise .7s .2s both}

main{max-width:1000px;margin:-18px auto 0;padding:0 16px 70px;position:relative}
nav{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;background:var(--card);padding:8px;border-radius:999px;width:fit-content;max-width:100%;box-shadow:0 6px 20px var(--shadow);border:1px solid var(--line);animation:rise .6s .15s both}
nav button{border:0;background:transparent;padding:9px 18px;border-radius:999px;cursor:pointer;font-size:.95rem;color:var(--mute);transition:all .25s}
nav button:hover{color:var(--ink);background:var(--bg)}
nav button.on{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 4px 12px rgba(108,76,241,.4)}

button.btn{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;border:0;padding:10px 18px;border-radius:10px;cursor:pointer;font-size:.95rem;font-weight:600;transition:transform .15s,box-shadow .2s,filter .2s;box-shadow:0 4px 12px rgba(108,76,241,.3)}
button.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 18px rgba(108,76,241,.4);filter:brightness(1.05)}
button.btn:active:not(:disabled){transform:scale(.96)}
button.btn:disabled{background:#b9bfd0;cursor:not-allowed;box-shadow:none}
button.ghost{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.55);padding:8px 14px;border-radius:10px;cursor:pointer;transition:background .2s,transform .15s}
button.ghost:hover{background:rgba(255,255,255,.3);transform:translateY(-1px)}

.view{animation:fade .35s both}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 14px var(--shadow);transition:transform .25s,box-shadow .25s,border-color .25s;animation:rise .5s both;animation-delay:calc(var(--i,0)*70ms)}
.card:hover{transform:translateY(-6px);box-shadow:0 16px 32px var(--shadow);border-color:var(--brand)}
.card h3{margin:0 0 4px;font-size:1.15rem}
.mute{color:var(--mute);font-size:.92rem;margin:3px 0}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:8px}
.badge{font-size:.8rem;padding:5px 12px;border-radius:999px;background:var(--okbg);color:var(--ok);font-weight:700}
.badge.low{background:var(--lowbg);color:var(--lowfg);animation:pulse 1.8s ease-in-out infinite}
.badge.full{background:var(--badbg);color:var(--bad)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,160,40,.5)}50%{box-shadow:0 0 0 8px rgba(255,160,40,0)}}

.skel{height:150px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(100deg,var(--card) 30%,var(--line) 50%,var(--card) 70%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}

label{display:block;font-size:.85rem;color:var(--mute);margin:12px 0 4px}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:1rem;background:#fff;color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px rgba(108,76,241,.18)}
.form{max-width:460px}

dialog{border:0;border-radius:18px;padding:26px;width:min(400px,92vw);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog[open]{animation:pop .3s cubic-bezier(.2,1.2,.4,1)}
dialog::backdrop{background:rgba(15,18,40,.55);backdrop-filter:blur(3px);animation:fade .3s}
dialog h2{margin:0 0 4px}
.link{color:var(--brand);cursor:pointer;font-size:.9rem;background:none;border:0;padding:0}
.link:hover{text-decoration:underline}
.empty{color:var(--mute);text-align:center;padding:50px 0;animation:rise .5s both}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:var(--ok);color:#fff;padding:13px 22px;border-radius:12px;opacity:0;transition:transform .35s cubic-bezier(.2,1.2,.4,1),opacity .25s;max-width:90vw;z-index:10;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.bad{background:var(--bad)}
.hide{display:none}

@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.88) translateY(10px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion: reduce){
*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<header>
  <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
  <div class="bar">
    <div><h1>StarLabs Fitness Studio</h1><div class="sub">Browse classes and book your slot &middot; times in IST</div></div>
    <div id="who"></div>
  </div>
</header>
<main>
  <nav>
    <button data-v="classes" class="on">Upcoming classes</button>
    <button data-v="bookings">My bookings</button>
    <button data-v="add">Add a class</button>
  </nav>

  <section id="classes" class="view"><div class="grid" id="classGrid"></div></section>
  <section id="bookings" class="view hide"><div class="grid" id="bookGrid"></div></section>
  <section id="add" class="view hide"><div class="card form">
    <h3>Create a class</h3>
    <form id="addForm">
      <label>Class name</label><input id="cName" required maxlength="100" placeholder="Yoga Flow">
      <label>Instructor</label><input id="cInst" required maxlength="100" placeholder="John Doe">
      <label>Date and time (IST)</label><input id="cWhen" type="datetime-local" required>
      <label>Available slots</label><input id="cSlots" type="number" min="1" max="1000" value="20" required>
      <div class="row"><button class="btn" type="submit">Create class</button></div>
    </form>
  </div></section>
</main>

<dialog id="authDlg">
  <h2 id="authTitle">Log in</h2><div class="mute" id="authSub">Welcome back.</div>
  <form id="authForm">
    <div id="nameWrap" class="hide"><label>Name</label><input id="aName" maxlength="100"></div>
    <label>Email</label><input id="aEmail" type="email" required>
    <label>Password (min 8 characters)</label><input id="aPass" type="password" required minlength="8" maxlength="72">
    <div class="row"><button class="btn" type="submit">Continue</button><button type="button" class="link" id="authSwap">Need an account? Sign up</button></div>
  </form>
</dialog>

<dialog id="bookDlg">
  <h2>Book class</h2><div class="mute" id="bookInfo"></div>
  <form id="bookForm">
    <label>Client name</label><input id="bName" required maxlength="100">
    <label>Client email</label><input id="bEmail" type="email" required>
    <div class="row"><button class="btn" type="submit">Confirm booking</button><button type="button" class="link" id="bookCancel">Cancel</button></div>
  </form>
</dialog>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => new Date(d).toLocaleString('en-IN', {timeZone:'Asia/Kolkata', dateStyle:'medium', timeStyle:'short'}) + ' IST';
let token = localStorage.getItem('token') || '';
let myEmail = localStorage.getItem('email') || '';
let signup = false, bookingClass = null, view = 'classes';

function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 3500);
}

async function api(path, method = 'GET', body) {
  const h = {};
  if (body) h['Content-Type'] = 'application/json';
  if (token) h['Authorization'] = 'Bearer ' + token;
  const r = await fetch(path, {method, headers: h, body: body ? JSON.stringify(body) : undefined});
  let data = null;
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) {
    if (r.status === 401 && token && path !== '/login') logout(true);
    let d = data && data.detail;
    if (Array.isArray(d)) d = d.map(x => (x.loc || []).slice(1).join('.') + ': ' + x.msg).join('; ');
    throw new Error(d || 'Error ' + r.status);
  }
  return data;
}

function renderWho() {
  $('#who').innerHTML = token
    ? '<span class="sub">' + esc(myEmail) + '</span> <button class="ghost" id="outBtn">Log out</button>'
    : '<button class="ghost" id="inBtn">Log in / Sign up</button>';
  if (token) $('#outBtn').onclick = () => logout(false);
  else $('#inBtn').onclick = () => openAuth(false);
}

function logout(expired) {
  token = ''; myEmail = '';
  localStorage.removeItem('token'); localStorage.removeItem('email');
  renderWho(); if (view !== 'classes') show('classes');
  toast(expired ? 'Session expired. Please log in again.' : 'Logged out.', expired);
}

function openAuth(isSignup) {
  signup = isSignup;
  $('#authTitle').textContent = signup ? 'Create account' : 'Log in';
  $('#authSub').textContent = signup ? 'Join the studio.' : 'Welcome back.';
  $('#nameWrap').classList.toggle('hide', !signup);
  $('#aName').required = signup;
  $('#authSwap').textContent = signup ? 'Have an account? Log in' : 'Need an account? Sign up';
  if (!$('#authDlg').open) $('#authDlg').showModal();
}
$('#authSwap').onclick = () => openAuth(!signup);

$('#authForm').onsubmit = async e => {
  e.preventDefault();
  const email = $('#aEmail').value.trim(), password = $('#aPass').value;
  try {
    if (signup) await api('/signup', 'POST', {name: $('#aName').value, email, password});
    const t = await api('/login', 'POST', {email, password});
    token = t.access_token; myEmail = email.toLowerCase();
    localStorage.setItem('token', token); localStorage.setItem('email', myEmail);
    $('#authDlg').close(); $('#authForm').reset();
    renderWho(); toast('Welcome!'); load();
  } catch (err) { toast(err.message, true); }
};

function show(v) {
  if ((v === 'bookings' || v === 'add') && !token) { openAuth(false); toast('Please log in first.', true); return; }
  view = v;
  document.querySelectorAll('main section').forEach(s => {
    const on = s.id === v;
    s.classList.toggle('hide', !on);
    if (on) { s.style.animation = 'none'; void s.offsetWidth; s.style.animation = ''; }
  });
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  load();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.v));

const skeletons = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';

async function load() {
  try {
    if (view === 'classes') {
      if (!$('#classGrid').children.length) $('#classGrid').innerHTML = skeletons;
      const list = await api('/classes');
      $('#classGrid').innerHTML = list.length ? list.map((c, i) => {
        const full = c.availableSlots === 0, low = c.availableSlots <= 3;
        return '<div class="card" style="--i:' + i + '"><h3>' + esc(c.name) + '</h3>' +
          '<p class="mute">with ' + esc(c.instructor) + '</p><p class="mute">' + esc(fmt(c.dateTime)) + '</p>' +
          '<div class="row"><span class="badge ' + (full ? 'full' : low ? 'low' : '') + '">' +
          (full ? 'Full' : c.availableSlots + ' slots left') + '</span>' +
          '<button class="btn" data-id="' + c.id + '" data-n="' + esc(c.name) + '"' + (full ? ' disabled' : '') + '>Book</button></div></div>';
      }).join('') : '<div class="empty">No upcoming classes yet.</div>';
      document.querySelectorAll('#classGrid button[data-id]').forEach(b => b.onclick = () => openBook(b.dataset.id, b.dataset.n));
    } else if (view === 'bookings') {
      $('#bookGrid').innerHTML = skeletons;
      const list = await api('/bookings');
      $('#bookGrid').innerHTML = list.length ? list.map((b, i) =>
        '<div class="card" style="--i:' + i + '"><h3>' + esc(b.class_name) + '</h3><p class="mute">with ' + esc(b.instructor) + '</p>' +
        '<p class="mute">' + esc(fmt(b.dateTime)) + '</p><p class="mute">Booked for ' + esc(b.client_name) +
        ' (' + esc(b.client_email) + ')</p></div>').join('') : '<div class="empty">You have no bookings yet.</div>';
    }
  } catch (err) { toast(err.message, true); }
}

function openBook(id, name) {
  if (!token) { openAuth(false); toast('Please log in to book.', true); return; }
  bookingClass = id; $('#bookInfo').textContent = name;
  $('#bEmail').value = myEmail; $('#bookDlg').showModal();
}
$('#bookCancel').onclick = () => $('#bookDlg').close();
$('#bookForm').onsubmit = async e => {
  e.preventDefault();
  try {
    await api('/book', 'POST', {class_id: Number(bookingClass), client_name: $('#bName').value, client_email: $('#bEmail').value});
    $('#bookDlg').close(); $('#bookForm').reset(); toast('Booked! See "My bookings".'); load();
  } catch (err) { toast(err.message, true); }
};

$('#addForm').onsubmit = async e => {
  e.preventDefault();
  try {
    await api('/classes', 'POST', {name: $('#cName').value, instructor: $('#cInst').value,
      dateTime: $('#cWhen').value + ':00', availableSlots: Number($('#cSlots').value)});
    $('#addForm').reset(); $('#cSlots').value = 20; toast('Class created.'); show('classes');
  } catch (err) { toast(err.message, true); }
};

renderWho(); load();
</script>
</body>
</html>
